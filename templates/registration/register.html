{% extends "base.html" %}
{% block title %}Client Registration - Bayan Bank{% endblock %}
{% block content %}
<h3 class="mb-3">Create a Client Account</h3>
<a href="{% url 'login' %}" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to Login</a>
<div class="card shadow-sm"><div class="card-body"><form method="post">{% csrf_token %}
<div class="row g-3"><div class="col-md-6"><label class="form-label">Username</label><input class="form-control" name="username" placeholder="maria.santos"></div><div class="col-md-6"><label class="form-label">Full Name</label><input class="form-control" name="full_name" placeholder="Maria Santos"></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email" placeholder="maria@example.ph"></div><div class="col-md-6"><label class="form-label">Mobile Number</label><input class="form-control" name="mobile" placeholder="0917 555 0142"></div><div class="col-md-6"><label class="form-label">Password</label><input type="password" class="form-control" name="password"></div><div class="col-md-6"><label class="form-label">Confirm Password</label><input type="password" class="form-control" name="confirm_password"></div></div>
<button class="btn btn-dark mt-3">Register</button> <a href="{% url 'complete_profile' %}" class="btn btn-outline-dark mt-3">Continue to Complete Profile</a>
</form></div></div>
{# GOOGLE BUTTON SPOT #}
{% endblock %}
