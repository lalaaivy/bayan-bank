{% extends "base.html" %}
{% block title %}Loan Product Form - Bayan Bank{% endblock %}
{% block content %}
<h3 class="mb-3">Add or Edit Loan Product</h3>
<a href="{% url 'admin_loan_products' %}" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to Loan Products</a>
<div class="card shadow-sm"><div class="card-body"><form method="post">{% csrf_token %}
<div class="row g-3"><div class="col-md-6"><label class="form-label">Product Name</label><input class="form-control" value="Personal Loan"></div><div class="col-md-6"><label class="form-label">Annual Interest Rate</label><div class="input-group"><input type="number" class="form-control" value="18"><span class="input-group-text">%</span></div></div><div class="col-md-6"><label class="form-label">Maximum Amount (&#8369;)</label><input type="number" class="form-control" value="300000"></div><div class="col-md-6"><label class="form-label">Maximum Term (months)</label><input type="number" class="form-control" value="24"></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="2">Flexible personal financing for eligible members.</textarea></div></div>
<button class="btn btn-dark mt-3">Save Product</button>
</form></div></div>
{% endblock %}
