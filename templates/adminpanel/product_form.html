{% extends "base.html" %}
{% block title %}Loan Product Form - Bayan Bank{% endblock %}
{% block content %}
<h3 class="mb-3">Add or Edit Loan Product</h3>
<a href="{% url 'admin_loan_products' %}" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to Loan Products</a>
<div class="card shadow-sm"><div class="card-body"><form method="post">{% csrf_token %}
<div class="row g-3">
  <div class="col-md-6"><label class="form-label">Product Name</label><input class="form-control" name="name" value="Personal Loan"></div>
  <div class="col-md-6"><label class="form-label">Annual Rate (%)</label><input type="number" class="form-control" name="annual_rate" value="18"></div>
  <div class="col-md-6"><label class="form-label">Minimum Amount (&#8369;)</label><input type="number" class="form-control" name="min_amount" value="5000"></div>
  <div class="col-md-6"><label class="form-label">Maximum Amount (&#8369;)</label><input type="number" class="form-control" name="max_amount" value="300000"></div>
  <div class="col-md-6"><label class="form-label">Maximum Term (months)</label><input type="number" class="form-control" name="max_term" value="24"></div>
  <div class="col-md-6"><label class="form-label">Penalty Rate (%)</label><input type="number" class="form-control" name="penalty_rate" value="2"></div>
  <div class="col-md-6"><label class="form-label">Maximum Installment Share (%)</label><input type="number" class="form-control" name="max_installment_share" value="40"></div>
  <div class="col-md-6"><label class="form-label">Minimum Savings Share (%)</label><input type="number" class="form-control" name="min_savings_share" value="10"></div>
  <div class="col-md-6"><label class="form-label">Minimum Credit Score</label><input type="number" class="form-control" name="min_credit_score" value="600"></div>
  <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="2">Flexible personal financing for eligible members.</textarea></div>
</div>
<button class="btn btn-dark mt-3">Save Product</button>
</form></div></div>
{% endblock %}
