{% extends "base.html" %}
{% block title %}Page Not Found - Bayan Bank{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-secondary">404</div>
  <h2 class="mb-3">We could not find that page</h2>
  <p class="text-muted">It may have moved or the link may be incorrect.</p>
  {% if request.user.is_authenticated %}
    <a href="{% url 'home' %}" class="btn btn-dark">Back to Dashboard</a>
  {% else %}
    <a href="{% url 'login' %}" class="btn btn-dark">Back to Login</a>
  {% endif %}
</div>
{% endblock %}
