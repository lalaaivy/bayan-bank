<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#00485C">

    <title>You're Offline | Bayan Bank</title>

    <style>
        :root {
            --teal: #00485C;
            --yellow: #FDBE1A;
            --cream: #F7F0E5;
            --text: #172B32;
            --muted: #7A8590;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--cream);
            color: var(--text);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .offline-card {
            width: 100%;
            max-width: 440px;
            padding: 40px 28px;

            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .07);
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;
            background: var(--yellow);
            color: var(--teal);
            font-size: 30px;
            font-weight: 800;
        }

        h1 {
            margin: 0 0 12px;
            color: var(--teal);
            font-size: 1.7rem;
        }

        p {
            margin: 0 0 24px;
            color: var(--muted);
            line-height: 1.7;
        }

        button {
            padding: 13px 24px;
            border: 0;
            border-radius: 12px;

            background: var(--teal);
            color: #fff;

            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #003747;
        }

        .security-note {
            margin-top: 24px;
            font-size: .82rem;
        }
    </style>
</head>

<body>
    <main class="offline-card">
        <div class="brand-icon" aria-hidden="true">B</div>

        <h1>You're Offline</h1>

        <p>
            Bayan Bank cannot connect to the internet right now.
            Please check your connection and try again.
        </p>

        <button type="button" onclick="window.location.reload()">
            Try Again
        </button>

        <p class="security-note">
            For your security, account balances, transactions,
            and other banking information are not available offline.
        </p>
    </main>
</body>
</html>
