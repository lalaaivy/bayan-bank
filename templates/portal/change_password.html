{% extends "base_client.html" %}
{% block title %}Change Password - Bayan Bank{% endblock %}
{% block content %}
<h3 class="mb-3">Change Password</h3>
<a href="{% url 'client_profile' %}" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to Profile</a>
<div class="card shadow-sm"><div class="card-body"><form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label">Current Password</label><input type="password" class="form-control" autocomplete="current-password"></div>
<div class="mb-3"><label class="form-label">New Password</label><input type="password" class="form-control" autocomplete="new-password"></div>
<div class="mb-3"><label class="form-label">Confirm New Password</label><input type="password" class="form-control" autocomplete="new-password"></div>
<button class="btn btn-dark">Update Password</button>
</form></div></div>
<style>
    .client-main > h3 {
        display: none;
    }

    .client-main > .card {
        background: #fff;
        border: 0;
        border-radius: 28px;
        box-shadow: 0 10px 30px rgba(18, 32, 43, 0.06);
    }

    .client-main > .card > .card-body {
        padding: 20px;
    }

    .client-main > .card form {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .client-main > .card form > .mb-3 {
        margin-bottom: 0 !important;
    }

    .client-main > .card .form-label {
        color: #4B5963;
    }

    .client-main > .card .form-control {
        border: 1px solid #E1E5EC;
        border-radius: 16px;
    }

    .client-main > .card .form-control:focus {
        border-color: #00485C;
        box-shadow: 0 0 0 0.2rem rgba(0, 72, 92, 0.14);
    }

    .client-main > .card .btn {
        border-radius: 999px;
    }

    .client-main > .card .btn-dark {
        background: #00485C;
        border-color: #00485C;
        color: #fff;
    }

    .client-main > .card .btn-dark:hover {
        background: #00323F;
        border-color: #00323F;
    }

    .client-main > .btn-outline-secondary {
        border-color: #00485C;
        border-radius: 999px;
        color: #00485C;
    }

    .client-main > .btn-outline-secondary:hover {
        background: #00485C;
        color: #fff;
    }
</style>
{% endblock %}
